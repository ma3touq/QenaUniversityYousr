plugins {
    id 'com.android.application'
}

android {
    namespace 'eg.qu.edu.yousr'
    compileSdk 35

    defaultConfig {
        applicationId 'eg.qu.edu.yousr'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}